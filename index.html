<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인생 한 판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1F1B3D;--ink2:#4A4570;--cream:#FFF9EE;--paper:#FFFFFF;
  --yellow:#FFC83D;--yellowd:#E09A00;--coral:#FF5D5D;--corald:#C93A3A;
  --teal:#16C08C;--teald:#0B8A63;--blue:#3E8BFF;--blued:#2160C4;--purple:#8B5CF6;--purpled:#5B32C4;
  --game:"Jua","Gowun Dodum","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{min-height:100vh;color:var(--ink);font-family:var(--body);line-height:1.6;background:#2E7BEA;transition:background .8s;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(rgba(255,255,255,.16) 2px,transparent 2.5px);background-size:26px 26px}
body.st0{background:linear-gradient(170deg,#56C8F5 0%,#2E8BEA 100%)}
body.st1{background:linear-gradient(170deg,#7A83FF 0%,#4644D6 100%)}
body.st2{background:linear-gradient(170deg,#37D39A 0%,#0F8F78 100%)}
body.st3{background:linear-gradient(170deg,#FFAA4C 0%,#EC5B4A 100%)}
body.st4{background:linear-gradient(170deg,#A57BF2 0%,#5A3BB5 100%)}
body.end{background:linear-gradient(180deg,#2A1E5C 0%,#7B3F9E 45%,#F27A6B 80%,#FFC27A 100%)}
body.title{background:linear-gradient(170deg,#4E7BFF 0%,#7B4FE0 60%,#E0559B 100%)}
#app{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:12px 14px 60px}
h1,h2,h3,.game{font-family:var(--game);font-weight:400;letter-spacing:.3px}

/* 공통 카드 (보드게임 카드 느낌: 굵은 테두리 + 그림자) */
.panel{background:var(--cream);border:3px solid var(--ink);border-radius:22px;box-shadow:0 7px 0 var(--ink);padding:20px;margin-top:14px;position:relative}
.center{text-align:center}
.sub{color:var(--ink2);margin:0 0 10px}
.btn{display:block;width:100%;margin-top:14px;padding:14px 16px;font-family:var(--game);font-size:21px;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--ink)}
.btn:active{transform:translateY(5px);box-shadow:0 0 0 var(--ink)}
.btn.go{background:var(--yellow)}
.btn.go::after{content:" ▶"}
.btn.pink{background:#FF8FC0}
.btn.small{font-size:17px;padding:10px}
.btnrow{display:flex;gap:10px}.btnrow .btn{flex:1}

/* ---------- 타이틀 화면 ---------- */
.logoWrap{text-align:center;color:#fff;margin:26px 0 6px}
.dice{display:inline-block;font-size:54px;animation:roll 2.6s ease-in-out infinite}
@keyframes roll{0%,70%,100%{transform:rotate(0)}78%{transform:rotate(-18deg) translateY(-8px)}86%{transform:rotate(14deg)}}
.logo{font-family:var(--game);font-size:64px;line-height:1.05;margin:4px 0;color:#fff;
  text-shadow:0 4px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink),0 -3px 0 var(--ink),3px 4px 0 var(--ink),-3px 4px 0 var(--ink),0 10px 0 rgba(0,0,0,.25)}
.logo span{color:var(--yellow)}
.tagline{font-family:var(--game);font-size:19px;background:var(--ink);color:#fff;display:inline-block;padding:4px 16px;border-radius:99px;margin-top:6px}
.nick{width:100%;font-family:var(--game);font-size:22px;text-align:center;padding:12px;border:3px solid var(--ink);border-radius:16px;background:#fff;color:var(--ink);outline:none}
.nick:focus{box-shadow:0 0 0 4px var(--yellow)}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 4px}
.rule{background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:8px 4px;font-size:13px;line-height:1.35}
.rule b{display:block;font-family:var(--game);font-size:24px;font-weight:400}
.dex{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.dexi{border:2.5px solid var(--ink);border-radius:12px;padding:8px 2px;font-size:11.5px;line-height:1.3;background:#fff;min-height:70px}
.dexi .e{font-size:24px;display:block}
.dexi.lock{background:#D9D6EA;color:#7A7699}
.dexi.lock .e{filter:grayscale(1) opacity(.5)}
.sectionT{font-family:var(--game);font-size:18px;margin:16px 0 0;display:flex;justify-content:space-between;align-items:center}

/* ---------- HUD ---------- */
.hud{display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;border-radius:18px;padding:8px 10px 8px 8px;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.ava{width:48px;height:48px;border-radius:50%;background:var(--yellow);border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.who{flex:1;min-width:0}
.who .nm{font-family:var(--game);font-size:20px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .ag{font-size:13px;opacity:.85}
.job{font-family:var(--game);font-size:14px;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.35);border-radius:99px;padding:3px 10px;white-space:nowrap}
.snd{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;padding:2px 4px}

/* 인생 길 (5단계 말판) */
.road{position:relative;display:flex;justify-content:space-between;margin:16px 6px 4px;padding:0 4px}
.road::before{content:"";position:absolute;left:24px;right:24px;top:21px;height:8px;background:rgba(255,255,255,.35);border-radius:9px}
.road .fill{position:absolute;left:24px;top:21px;height:8px;background:var(--yellow);border-radius:9px;transition:width .8s}
.node{position:relative;z-index:1;width:50px;text-align:center}
.node .c{width:48px;height:48px;margin:0 auto;border-radius:50%;background:#fff;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 4px 0 var(--ink)}
.node.done .c{background:var(--yellow)}
.node.todo .c{background:rgba(255,255,255,.55);border-color:rgba(31,27,61,.5);box-shadow:none;filter:grayscale(.6)}
.node.on .c{background:var(--yellow);transform:scale(1.12);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 4px 0 var(--ink),0 0 0 0 rgba(255,200,61,.8)}50%{box-shadow:0 4px 0 var(--ink),0 0 0 10px rgba(255,200,61,0)}}
.node .l{font-family:var(--game);font-size:13px;color:#fff;margin-top:6px;text-shadow:0 2px 0 rgba(0,0,0,.3);white-space:nowrap}
.node .pc{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:20px;animation:hop 1s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-6px)}}

/* 이번 단계 칸(턴) */
.turns{display:flex;align-items:center;gap:6px;justify-content:center;margin:8px 0 0}
.sq{width:30px;height:30px;border-radius:9px;border:2.5px solid var(--ink);background:rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;font-size:14px;font-family:var(--game)}
.sq.done{background:#fff}
.sq.on{background:var(--yellow);transform:scale(1.15);box-shadow:0 3px 0 var(--ink)}
.turnlbl{font-family:var(--game);color:#fff;font-size:15px;margin-left:6px;text-shadow:0 2px 0 rgba(0,0,0,.3)}

/* ---------- 이벤트 카드 ---------- */
.ecard{padding:0;overflow:visible;animation:deal .55s cubic-bezier(.2,1.3,.4,1) both}
@keyframes deal{from{transform:translateY(40px) rotate(-4deg) scale(.9);opacity:0}to{transform:none;opacity:1}}
.ribbon{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-family:var(--game);font-size:17px;padding:4px 18px;border:3px solid var(--ink);border-radius:99px;background:var(--teal);color:#fff;white-space:nowrap;box-shadow:0 3px 0 var(--ink);z-index:2}
.t-must .ribbon{background:var(--purple)}
.t-job .ribbon{background:var(--blue)}
.t-special .ribbon{background:var(--yellow);color:var(--ink)}
.t-crisis .ribbon{background:var(--coral)}
.t-special{background:linear-gradient(#FFF6D6,#FFFBEF)}
.t-crisis{background:#FFF1EE}
.ebody{padding:26px 20px 20px}
.etitle{font-family:var(--game);font-size:27px;line-height:1.25;margin:0 0 6px}
.etext{font-size:17.5px;margin:0 0 16px}
.choices{display:flex;flex-direction:column;gap:12px}
.choice{position:relative;display:flex;gap:12px;align-items:center;text-align:left;padding:13px 14px;border:3px solid var(--ink);border-radius:16px;background:#fff;font-family:var(--body);font-size:16.5px;color:var(--ink);cursor:pointer;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s,background .15s;animation:pop .4s both}
.choice:nth-child(2){animation-delay:.08s}.choice:nth-child(3){animation-delay:.16s}.choice:nth-child(4){animation-delay:.24s}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.choice:hover{background:#FFF4C7;transform:translateY(-2px);box-shadow:0 7px 0 var(--ink)}
.choice:active{transform:translateY(5px);box-shadow:0 0 0 var(--ink)}
.choice .k{flex:none;width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;font-family:var(--game);font-size:19px;display:flex;align-items:center;justify-content:center}
.choice.rec{background:#E3FFF2}
.choice.rec .k{background:var(--teal)}
.choice.rec .rt{display:block;font-family:var(--game);color:var(--teald);font-size:15px}
.choice.picked{background:var(--yellow)!important;animation:none}
.choice.dim{opacity:.35;animation:none}

/* 그림 자리 */
.img{border-radius:19px 19px 0 0;overflow:hidden;position:relative;border-bottom:3px solid var(--ink);background:#EAF2FF}
.img img{display:block;width:100%;height:auto}
.img .phl{display:none}
.img.ph{height:150px;display:flex;align-items:center;justify-content:center;flex-direction:column;background:repeating-linear-gradient(45deg,#EEF3FF,#EEF3FF 14px,#E2EAFF 14px,#E2EAFF 28px)}
.img.ph img{display:none}.img.ph .phl{display:block;color:#7A86B8;font-size:13px;font-family:var(--game)}
.img.ph .phl::before{content:"🖼️";display:block;font-size:30px;text-align:center}
body.noph .img.ph{display:none}
.panel>.img{margin:-20px -20px 16px}

/* ---------- 결과 ---------- */
.res{animation:deal .45s cubic-bezier(.2,1.3,.4,1) both}
.picked-line{display:flex;gap:10px;align-items:center;background:#fff;border:2.5px dashed var(--ink2);border-radius:14px;padding:10px 12px;font-size:15px}
.picked-line .tag{flex:none;font-family:var(--game);background:var(--ink);color:#fff;border-radius:8px;padding:2px 8px;font-size:13px}
.bubble{position:relative;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:16px 18px;margin:20px 0 6px;font-size:18.5px;font-weight:700}
.bubble::before{content:"";position:absolute;top:-14px;left:28px;border:12px solid transparent;border-bottom-color:var(--ink);border-top:0}
.bubble::after{content:"";position:absolute;top:-9px;left:31px;border:9px solid transparent;border-bottom-color:#fff;border-top:0}
.boom{display:flex;gap:10px;align-items:flex-start;background:linear-gradient(90deg,#EBDDFF,#F7F0FF);border:3px solid var(--purpled);border-radius:16px;padding:12px 14px;margin-top:14px;font-size:15.5px;animation:shake .6s .35s both}
.boom .bt{flex:none;font-family:var(--game);background:var(--purple);color:#fff;border-radius:10px;padding:2px 8px;font-size:14px;white-space:nowrap}
@keyframes shake{0%{transform:scale(.6);opacity:0}50%{transform:scale(1.06) rotate(1deg);opacity:1}70%{transform:rotate(-1deg)}100%{transform:none}}
.stamp{position:absolute;top:-15px;right:18px;background:var(--cream);font-family:var(--game);color:var(--corald);border:3px solid var(--corald);border-radius:10px;padding:0 8px;font-size:16px;transform:rotate(8deg);opacity:.85;animation:stamp .4s .2s both}
@keyframes stamp{from{transform:rotate(8deg) scale(2.2);opacity:0}to{transform:rotate(8deg) scale(1);opacity:.85}}
.win{background:linear-gradient(#FFF1B8,#FFF9E6)}
.jackpot{font-family:var(--game);font-size:38px;text-align:center;color:var(--yellowd);text-shadow:0 3px 0 var(--ink);animation:shake .7s both}

/* ---------- 단계 클리어 ---------- */
.clear{text-align:center;color:#fff;margin:18px 0 0}
.clear .big{font-family:var(--game);font-size:46px;line-height:1.1;color:var(--yellow);
  text-shadow:0 4px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink),0 -3px 0 var(--ink),3px 4px 0 var(--ink),-3px 4px 0 var(--ink);animation:shake .7s both}
.clear .sm{font-family:var(--game);font-size:18px;margin-top:4px}
.stars{font-size:34px;letter-spacing:2px;margin:4px 0}
.stars span{display:inline-block;filter:grayscale(1) opacity(.35);transform:scale(.6);transition:all .4s}
.stars span.got{filter:none;transform:scale(1)}
.starlbl{font-size:13px;color:var(--ink2);margin-top:-4px}
.bars{margin:8px 0 4px}
.bar{display:flex;align-items:center;gap:8px;margin:11px 0}
.bn{width:72px;font-family:var(--game);font-size:17px;flex:none;white-space:nowrap}
.track{flex:1;height:22px;background:#E7E3F2;border:2.5px solid var(--ink);border-radius:12px;overflow:hidden;position:relative}
.track i{display:block;height:100%;border-right:2.5px solid var(--ink);transition:width 1.1s cubic-bezier(.3,1.2,.5,1);background-image:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,0) 60%)}
.track.low{animation:blink 1s infinite}
@keyframes blink{50%{background:#FFD3D3}}
.arr{width:26px;text-align:center;font-family:var(--game);font-size:18px;flex:none}
.arr.up{color:var(--teald)}.arr.down{color:var(--corald)}.arr.same{color:#9A96B5}
.comment{font-size:17px;margin:14px 0 4px;background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:12px 14px}
.warnmsg{background:#FFE1DE;border:2.5px solid var(--corald);color:#9C2B2B;border-radius:14px;padding:10px 12px;font-size:15px;margin-top:10px}
.gift{background:#FFF3C4;border:3px dashed var(--yellowd);border-radius:16px;padding:12px 14px;margin:12px 0;font-size:16px}
.gift b{font-family:var(--game);font-weight:400;font-size:19px}

/* ---------- 엔딩 ---------- */
.endhead{text-align:center;color:#fff;margin-top:20px}
.endhead .lbl{font-family:var(--game);font-size:18px;letter-spacing:3px;opacity:.9}
.endhead .ttl{font-family:var(--game);font-size:44px;line-height:1.15;color:#fff;
  text-shadow:0 4px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink),0 -3px 0 var(--ink),3px 4px 0 var(--ink),-3px 4px 0 var(--ink);animation:shake .8s both}
.endsub{display:inline-block;font-family:var(--game);background:var(--yellow);color:var(--ink);border:3px solid var(--ink);border-radius:99px;padding:2px 14px;margin-top:8px}
.newdex{display:inline-block;font-family:var(--game);background:var(--coral);color:#fff;border:3px solid var(--ink);border-radius:10px;padding:2px 10px;font-size:15px;margin-top:8px;animation:pulse 1.4s infinite}
.q{display:block;font-family:var(--game);font-size:18px;margin:16px 0 6px}
textarea{width:100%;height:80px;resize:none;border:3px solid var(--ink);border-radius:14px;padding:10px 12px;font:16px var(--body);background:#fff;color:var(--ink);outline:none}
textarea:focus{box-shadow:0 0 0 4px var(--yellow)}
.cnt{font-size:12px;color:var(--ink2);text-align:right}

/* ---------- 결과 카드 (캡처용) ---------- */
.rcard{background:var(--cream);border:4px solid var(--ink);border-radius:24px;max-width:640px;margin:16px auto 0;overflow:hidden;box-shadow:0 8px 0 var(--ink)}
.rhead{text-align:center;color:#fff;padding:18px 16px 16px;background:linear-gradient(135deg,#6A4BE0,#E0559B)}
.rname{font-family:var(--game);font-size:16px;opacity:.95}
.rtitle{font-family:var(--game);font-size:34px;line-height:1.2;text-shadow:0 3px 0 rgba(31,27,61,.55)}
.rsub{display:inline-block;font-family:var(--game);font-size:14px;background:var(--yellow);color:var(--ink);border:2.5px solid var(--ink);border-radius:99px;padding:0 12px;margin-top:6px}
.rin{padding:16px 18px 18px}
.rin .img{border-radius:16px;border:3px solid var(--ink);margin-bottom:12px}
.rtext{font-size:15.5px;margin:0 0 6px}
.rsec{font-family:var(--game);font-size:18px;margin:16px 0 6px;display:flex;align-items:center;gap:6px}
.rsec::after{content:"";flex:1;height:3px;background:var(--ink);opacity:.15;border-radius:2px}
.gbox{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px}
.rlist{margin:0;padding:0;list-style:none}
.rlist li{background:#fff;border:2px solid #D9D4EC;border-radius:10px;padding:6px 10px;margin:5px 0;font-size:14.5px}
.rlist li b{font-family:var(--game);font-weight:400;color:var(--purpled);margin-right:4px}
.rq{font-family:var(--game);font-size:15px;color:var(--ink2);margin-top:10px}
.ra{font-size:15px;background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:8px 10px;white-space:pre-wrap;word-break:break-all;min-height:38px;margin-top:3px}
.legend{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;font-size:13px;font-family:var(--game);margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px;border:2px solid var(--ink);vertical-align:-1px}
.rfoot{text-align:center;font-family:var(--game);font-size:13px;color:#8D88AD;margin-top:16px}
canvas#graph{width:100%;height:auto;display:block}
.actions{max-width:640px;margin:6px auto 0}
.keyhint{text-align:center;color:rgba(255,255,255,.75);font-size:12px;margin-top:10px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
@media (max-width:480px){
  .logo{font-size:52px}.etitle{font-size:24px}.node{width:44px}.node .c{width:42px;height:42px;font-size:19px}
  .road::before,.road .fill{top:18px}.node .l{font-size:12px}.clear .big,.endhead .ttl{font-size:38px}
  .dexi{font-size:10.5px}
}
</style>
</head>
<body class="title">
<canvas id="fx"></canvas>
<div id="app"></div>
<script src="html2canvas.min.js"></script>
<script src="game.js"></script>
<script>
const G = window.LifeGame;
if(!G){document.body.innerHTML='<div style="padding:24px;font:16px sans-serif;line-height:1.7;background:#fff">⚠ game.js 파일을 불러오지 못했어요.<br>index.html과 <b>같은 폴더</b>에 game.js(소문자)가 올라가 있는지 확인해 주세요.</div>';throw new Error('game.js not loaded');}
const SAVE_KEY = 'lifegame_save_v1';
const DEX_KEY = 'lifegame_endings_v1';
const SND_KEY = 'lifegame_sound_v1';
const SHOW_PLACEHOLDER = true;   // 그림 파일(img/이름.png)이 없을 때 '그림 자리'를 보여줄지 (완성 후 false)
const STAGE_ICON = ['🎒', '📚', '🚀', '🏡', '🌅'];
const AVATAR = ['🧒', '🧑‍🎓', '🧑', '🧑‍💼', '🧓'];
const RIBBON = { pool: '🎴 일상 카드', must: '⭐ 운명 카드', job: '💼 직업 카드', special: '✨ 특별 카드', crisis: '🔥 위기 카드' };
const END_ICON = { balanced: '⚖️', rise: '🌱', lucky: '🍀', effort: '💦', lopsided: '🎯' };
const END_ORDER = ['balanced', 'effort', 'rise', 'lucky', 'lopsided'];
let S = null, ev = null, busy = false;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
if (!SHOW_PLACEHOLDER) document.body.classList.add('noph');

function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
function loadSave() { try { const j = localStorage.getItem(SAVE_KEY); return j ? JSON.parse(j) : null; } catch (e) { return null; } }
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }
function getDex() { try { return JSON.parse(localStorage.getItem(DEX_KEY) || '[]'); } catch (e) { return []; } }
function addDex(k) { const d = getDex(); if (d.indexOf(k) >= 0) return false; d.push(k); try { localStorage.setItem(DEX_KEY, JSON.stringify(d)); } catch (e) {} return true; }
function view(html) { $('app').innerHTML = html; window.scrollTo(0, 0); }
function theme(c) { document.body.className = c + (SHOW_PLACEHOLDER ? '' : ' noph'); }
function img(name) {
  if (!name) return '';
  return '<div class="img"><img src="img/' + name + '.png" alt="" onerror="this.parentNode.className+=\' ph\'"><span class="phl">그림 자리 · ' + name + '</span></div>';
}

/* ---------- 효과음 (WebAudio, 파일 없음) ---------- */
let AC = null, soundOn = (function () { try { return localStorage.getItem(SND_KEY) !== 'off'; } catch (e) { return true; } })();
function tone(f, d, type, delay, vol) {
  if (!soundOn) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'triangle'; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(vol || 0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d);
  } catch (e) {}
}
const SFX = {
  click: () => tone(660, .08, 'square', 0, .05),
  card: () => { tone(330, .08, 'triangle'); tone(495, .1, 'triangle', .06); },
  pick: () => { tone(523, .09); tone(784, .14, 'triangle', .07); },
  boom: () => [392, 523, 659, 784].forEach((f, i) => tone(f, .16, 'sine', i * .07, .1)),
  clear: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .22, 'triangle', i * .11, .12)),
  win: () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, .2, 'square', i * .09, .06)),
  crisis: () => { tone(220, .25, 'sawtooth', 0, .05); tone(196, .35, 'sawtooth', .2, .05); },
  end: () => [392, 494, 587, 784, 988].forEach((f, i) => tone(f, .45, 'sine', i * .18, .1))
};
function toggleSnd() { soundOn = !soundOn; try { localStorage.setItem(SND_KEY, soundOn ? 'on' : 'off'); } catch (e) {} const b = $('snd'); if (b) b.textContent = soundOn ? '🔊' : '🔇'; if (soundOn) SFX.click(); }

/* ---------- 색종이 효과 ---------- */
function confetti(n) {
  const cv = $('fx'), ctx = cv.getContext('2d'); cv.width = innerWidth; cv.height = innerHeight;
  const cols = ['#FFC83D', '#FF5D5D', '#3E8BFF', '#16C08C', '#FF6FB5', '#8B5CF6'];
  const ps = Array.from({ length: n || 120 }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 120, y: innerHeight * .35, vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4, r: Math.random() * 6 + 4, c: cols[Math.floor(Math.random() * cols.length)], a: Math.random() * 6, va: (Math.random() - .5) * .4 }));
  let f = 0;
  (function loop() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    ps.forEach(p => { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); ctx.restore(); });
    if (++f < 150) requestAnimationFrame(loop); else ctx.clearRect(0, 0, cv.width, cv.height);
  })();
}

/* ---------- HUD + 인생 길 ---------- */
function jobName() {
  const k = S.careerKey;
  if (!k) return S.stage >= 2 ? '' : '학생';
  if (k === 'jobless') return '구직 중';
  return (G.CAREERS[k] && G.CAREERS[k].name) || '';
}
function hud(showTurns, after) {
  const jn = jobName();
  const top = '<div class="hud"><div class="ava">' + AVATAR[S.stage] + '</div><div class="who"><div class="nm">' + esc(S.name) + '</div><div class="ag">' + G.ageOf(S) + '세 · ' + G.STAGES[S.stage].name + '</div></div>' +
    (jn ? '<span class="job">' + esc(jn) + '</span>' : '') + '<button class="snd" id="snd" onclick="toggleSnd()" title="소리">' + (soundOn ? '🔊' : '🔇') + '</button></div>';
  const pct = (S.stage / 4) * 100;
  const road = '<div class="road"><div class="fill" style="width:calc((100% - 48px) * ' + (pct / 100) + ')"></div>' +
    G.STAGES.map((s, i) => '<div class="node ' + (i === S.stage ? 'on' : (i < S.stage ? 'done' : 'todo')) + '">' + '<div class="c">' + (i < S.stage ? '✔' : STAGE_ICON[i]) + '</div><div class="l">' + s.name + '</div></div>').join('') + '</div>';
  let turns = '';
  if (showTurns) {
    const cur = Math.max(0, Math.min(after ? S.idx - 1 : S.idx, S.len - 1));
    let sq = '';
    for (let i = 0; i < S.len; i++) sq += '<div class="sq ' + (i < cur ? 'done' : (i === cur ? 'on' : '')) + '">' + (i < cur || (after && i === cur) ? '✔' : (i === cur ? '?' : '')) + '</div>';
    turns = '<div class="turns">' + sq + '<span class="turnlbl">' + (cur + 1) + ' / ' + S.len + ' 칸</span></div>';
  }
  return top + road + turns;
}

/* ---------- 타이틀 ---------- */
function showStart() {
  theme('title');
  const sv = loadSave(), dex = getDex();
  const resumeBtn = sv && sv.phase !== 'card' ? '<button class="btn small" onclick="resume()">💾 이어하기 · ' + esc(sv.name) + ' (' + G.STAGES[sv.stage].name + ')</button>' : '';
  const dexHtml = END_ORDER.map(k => { const on = dex.indexOf(k) >= 0; return '<div class="dexi ' + (on ? '' : 'lock') + '"><span class="e">' + (on ? END_ICON[k] : '❔') + '</span>' + (on ? esc(G.ENDINGS[k].title) : '???') + '</div>'; }).join('');
  view('<div class="logoWrap"><div class="dice">🎲</div><div class="logo">인생 <span>한 판</span></div><div class="tagline">선택이 쌓여 나의 인생이 된다!</div></div>' +
    '<div class="panel center">' +
    '<div class="rules"><div class="rule"><b>5</b>인생 단계<br>아동기→노년기</div><div class="rule"><b>💪📘💰😊🤝</b>다섯 능력치<br>고르게 지키기</div><div class="rule"><b>💫</b>지난 선택이<br>다시 돌아와요</div></div>' +
    '<input class="nick" type="text" id="nick" maxlength="8" placeholder="플레이어 이름 (8자)" onkeydown="if(event.key===\'Enter\')startNew()">' +
    '<button class="btn go" onclick="startNew()">게임 시작</button>' + resumeBtn +
    '<div class="sectionT"><span>📖 엔딩 도감</span><span>' + dex.length + ' / 5</span></div><div class="dex">' + dexHtml + '</div></div>');
}
function startNew() {
  SFX.pick();
  const name = ($('nick').value || '').trim() || '나';
  S = G.newState(name); S.phase = 'birth'; save(); showBirth();
}
function resume() {
  SFX.click();
  S = loadSave(); if (!S) return showStart();
  ({ birth: showBirth, play: showEvent, summary: () => showSummary(S.summary), ending: showEnding, reflect: showReflect, card: showCard }[S.phase] || showEvent)();
}
function showBirth() {
  theme('st0');
  const t = S.talent ? '<div class="gift"><b>🎁 작은 선물을 받았어요!</b><br>' + esc(G.TALENT[S.talent]) + '</div>' : '<p class="sub">아직 어떤 모습이 될지 아무도 몰라요.<br>작은 가능성을 품고 태어났어요.</p>';
  view('<div class="clear"><div class="big">GAME START</div><div class="sm">플레이어 ' + esc(S.name) + ' 등장!</div></div>' +
    '<div class="panel center res">' + img(S.talent ? 'birth_gift' : 'birth') + '<h2 style="font-size:26px;margin:4px 0 8px">' + esc(S.name) + '의 이야기가 시작돼요</h2>' + t +
    '<p class="sub" style="font-size:14px">능력치는 각 단계가 끝날 때 확인할 수 있어요.<br>어느 하나도 바닥나지 않게 지켜 보세요!</p>' +
    '<button class="btn go" onclick="beginPlay()">첫 번째 칸으로</button></div>');
  if (S.talent) setTimeout(() => { SFX.boom(); confetti(60); }, 300);
}
function beginPlay() { SFX.click(); S.phase = 'play'; save(); showEvent(); }

/* ---------- 이벤트 ---------- */
function showEvent() {
  theme('st' + S.stage);
  ev = G.nextEvent(S);
  if (!ev) return stageEnd();
  S.phase = 'play'; save(); busy = false;
  const ch = G.getChoices(S, ev);
  view(hud(true) + '<div class="panel ecard t-' + ev.type + '"><div class="ribbon">' + (RIBBON[ev.type] || RIBBON.pool) + '</div>' + img(ev.img).replace('class="img"', 'class="img" style="margin:0"') +
    '<div class="ebody"><div class="etitle">' + esc(ev.title) + '</div><p class="etext">' + esc(ev.text) + '</p><div class="choices">' +
    ch.map((c, i) => '<button class="choice ' + (c.rec ? 'rec' : '') + '" onclick="pick(' + i + ',this)"><span class="k">' + (c.rec ? '🌱' : (i + 1)) + '</span><span>' + (c.rec ? '<span class="rt">마음의 소리</span>' : '') + esc(c.t) + '</span></button>').join('') +
    '</div></div></div><div class="keyhint">숫자 키(1·2·3)로도 고를 수 있어요</div>');
  ev.type === 'crisis' ? SFX.crisis() : SFX.card();
}
function pick(i, btn) {
  if (busy) return; busy = true;
  SFX.pick();
  document.querySelectorAll('.choice').forEach(b => { b.disabled = true; b.classList.add(b === btn ? 'picked' : 'dim'); });
  setTimeout(() => showResult(G.choose(S, ev, i)), 420);
}
function showResult(out) {
  save(); busy = false;
  view(hud(true, true) + '<div class="panel res ' + (out.lucky ? 'win' : '') + '">' + (out.lucky ? '<div class="jackpot">🎉 당첨! 🎉</div>' : '<div class="stamp">선택 완료</div>') +
    '<div class="picked-line"><span class="tag">내 선택</span><span>' + esc(out.choice) + '</span></div>' +
    '<div class="bubble">' + esc(out.text) + '</div>' +
    out.extra.map(x => '<div class="boom"><span class="bt">💫 부메랑!</span><span>' + esc(x) + '</span></div>').join('') +
    '<button class="btn go" id="next" onclick="nextTurn()">다음 칸으로</button></div>');
  if (out.lucky) { SFX.win(); confetti(200); }
  else if (out.extra.length) setTimeout(SFX.boom, 350);
}
function nextTurn() { if (busy) return; busy = true; SFX.click(); showEvent(); }

/* ---------- 단계 클리어 ---------- */
function stageEnd() { const sum = G.endStage(S); save(); showSummary(sum); }
function showSummary(sum) {
  theme('st' + S.stage);
  const from = S.stageStart || {};
  const stars = sum.bars.filter(b => b.v >= 40).length;
  const bars = sum.bars.map(b => {
    const a = b.arrow === '▲' ? 'up' : (b.arrow === '▼' ? 'down' : 'same');
    const f = from[b.k] != null ? from[b.k] : b.v;
    return '<div class="bar"><span class="bn">' + b.icon + ' ' + b.name + '</span><span class="track ' + (b.warn ? 'low' : '') + '"><i data-w="' + b.v + '" style="width:' + f + '%;background-color:' + b.color + '"></i></span><span class="arr ' + a + '">' + (a === 'same' ? '－' : b.arrow) + '</span></div>';
  }).join('');
  view(hud(false) + '<div class="clear"><div class="big">' + esc(sum.stageName) + ' 클리어!</div><div class="sm">' + (S.stage >= 4 ? '마지막 단계까지 왔어요' : '다음 단계: ' + G.STAGES[S.stage + 1].name) + '</div></div>' +
    '<div class="panel res center"><div class="stars">' + [0, 1, 2, 3, 4].map(i => '<span data-i="' + i + '">⭐</span>').join('') + '</div><div class="starlbl">균형 별 · 40 넘게 지킨 능력치 ' + stars + '개</div>' +
    '<div class="bars" style="text-align:left">' + bars + '</div><div class="comment" style="text-align:left">' + esc(sum.text) + '</div>' +
    (sum.warn.length ? '<div class="warnmsg" style="text-align:left">⚠ ' + sum.warn.join(', ') + '이(가) 바닥에 가까워요! 다음 단계에서는 이 부분을 돌봐 주세요.</div>' : '') +
    '<button class="btn go" onclick="afterSummary()">' + (S.stage >= 4 ? '엔딩 보기' : '다음 단계로') + '</button></div>');
  SFX.clear();
  setTimeout(() => {
    document.querySelectorAll('.track i').forEach(t => t.style.width = t.dataset.w + '%');
    document.querySelectorAll('.stars span').forEach((s, i) => { if (i < stars) setTimeout(() => { s.classList.add('got'); tone(880 + i * 110, .12, 'triangle', 0, .08); }, 250 * i); });
  }, 350);
  if (stars === 5) setTimeout(() => confetti(90), 1500);
}
function afterSummary() { SFX.click(); if (S.stage >= 4) showEnding(); else { G.beginStage(S); save(); showEvent(); } }

/* ---------- 엔딩 / 성찰 / 결과 카드 ---------- */
function showEnding() {
  S.phase = 'ending'; save(); theme('end');
  const e = G.ending(S);
  const isNew = addDex(e.key);
  const n = END_ORDER.indexOf(e.key) + 1;
  view('<div class="endhead"><div class="lbl">ENDING ' + n + ' / 5</div><div class="ttl">' + (END_ICON[e.key] || '') + ' ' + esc(e.title) + '</div>' +
    (e.sub ? '<div class="endsub">' + esc(e.sub) + '</div>' : '') + (isNew ? '<div><span class="newdex">📖 엔딩 도감에 새로 등록!</span></div>' : '') + '</div>' +
    '<div class="panel center res">' + img(e.img) + '<p style="font-size:17.5px;margin:4px 0 8px">' + esc(e.text) + '</p>' +
    (e.note ? '<p class="sub">' + esc(e.note) + '</p>' : '') + (e.talent ? '<div class="gift"><b>🎁 태어날 때 받은 작은 선물</b><br>' + esc(e.talent) + '</div>' : '') +
    '<button class="btn go" onclick="showReflect()">내 인생 돌아보기</button></div>');
  SFX.end(); setTimeout(() => confetti(140), 500);
}
function showReflect() {
  S.phase = 'reflect'; save(); theme('end');
  view('<div class="endhead"><div class="lbl">LAST QUEST</div><div class="ttl" style="font-size:36px">내 인생 돌아보기</div></div>' +
    '<div class="panel"><p class="sub">생각을 짧게 적어 보세요. 결과 카드에 함께 들어가요.</p>' +
    G.REFLECT.map((q, i) => '<label class="q">Q' + (i + 1) + '. ' + esc(q) + '</label><textarea id="r' + i + '" maxlength="100" oninput="onR(' + i + ')">' + esc(S.reflect[i]) + '</textarea><div class="cnt" id="c' + i + '">' + S.reflect[i].length + '/100</div>').join('') +
    '<button class="btn go" onclick="SFX.pick();showCard()">결과 카드 만들기</button></div>');
}
function onR(i) { const v = $('r' + i).value; S.reflect[i] = v; $('c' + i).textContent = v.length + '/100'; save(); }

function drawGraph(cv) {
  const ctx = cv.getContext('2d'), W = cv.width, H = cv.height, L = 14, R = 18, T = 16, B = 40;
  const h = S.hist, n = h.length;
  const x = i => L + (W - L - R) * i / Math.max(1, n - 1), y = v => T + (H - T - B) * (1 - v / 100);
  ctx.clearRect(0, 0, W, H);
  const band = ['#E6F4FF', '#ECEBFF', '#E3F8EF', '#FFF0E2', '#F2EAFF'];
  let start = 0, bi = 0;
  h.forEach((p, i) => {
    if (p.kind === 'end') {
      ctx.fillStyle = band[bi] || '#fff'; ctx.fillRect(x(start), T, x(i) - x(start), H - T - B);
      ctx.fillStyle = '#1F1B3D'; ctx.font = '22px Jua, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(G.STAGES[bi].name, (x(start) + x(i)) / 2, H - 12);
      start = i; bi++;
    }
  });
  ctx.strokeStyle = 'rgba(31,27,61,.12)'; ctx.lineWidth = 2; ctx.setLineDash([6, 6]);
  [25, 50, 75].forEach(v => { ctx.beginPath(); ctx.moveTo(L, y(v)); ctx.lineTo(W - R, y(v)); ctx.stroke(); });
  ctx.setLineDash([]);
  G.STATS.forEach(k => {
    ctx.beginPath(); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    h.forEach((p, i) => { const px = x(i), py = y(p.st[k]); if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py); });
    ctx.strokeStyle = '#1F1B3D'; ctx.lineWidth = 9; ctx.stroke();
    ctx.strokeStyle = G.SCOLOR[k]; ctx.lineWidth = 5; ctx.stroke();
    const last = h[n - 1]; ctx.beginPath(); ctx.fillStyle = G.SCOLOR[k]; ctx.arc(x(n - 1), y(last.st[k]), 9, 0, 7); ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#1F1B3D'; ctx.stroke();
  });
}
function showCard() {
  S.phase = 'card'; save(); theme('end');
  const e = G.ending(S);
  const legend = G.STATS.map(k => '<span><i style="background:' + G.SCOLOR[k] + '"></i>' + G.SNAME[k] + '</span>').join('');
  const ch = e.choices.length ? '<ul class="rlist">' + e.choices.map(c => '<li><b>' + esc(c.stage) + '</b>' + esc(c.k) + '</li>').join('') + '</ul>' : '<p class="sub">특별히 눈에 띄는 갈림길 없이 차분하게 걸어온 인생이었어요.</p>';
  const lk = e.links.length ? '<div class="rsec">💫 이어진 선택</div><ul class="rlist">' + e.links.map(l => '<li>' + esc(l.seed) + ' → <b style="margin:0">' + esc(l.fruit) + '</b></li>').join('') + '</ul>' : '';
  const rf = G.REFLECT.map((q, i) => '<div class="rq">Q' + (i + 1) + '. ' + esc(q) + '</div><div class="ra">' + (S.reflect[i] ? esc(S.reflect[i]) : '<span style="color:#A9A4C4">(적지 않았어요)</span>') + '</div>').join('');
  const d = new Date();
  view('<div id="card" class="rcard"><div class="rhead"><div class="rname">🎲 ' + esc(S.name) + '의 인생 한 판</div><div class="rtitle">' + (END_ICON[e.key] || '') + ' ' + esc(e.title) + '</div>' + (e.sub ? '<div class="rsub">' + esc(e.sub) + '</div>' : '') + '</div><div class="rin">' +
    '<div class="img"><img src="img/' + e.img + '.png" alt="" onerror="this.parentNode.remove()"></div>' +
    '<div class="rtext">' + esc(e.text) + (e.note ? '<br>' + esc(e.note) : '') + '</div>' +
    '<div class="rsec">📈 능력치의 흐름</div><div class="gbox"><canvas id="graph" width="640" height="260"></canvas><div class="legend">' + legend + '</div></div>' +
    '<div class="rsec">🔀 인생의 갈림길</div>' + ch + lk + '<div class="rsec">💭 내 인생을 돌아보며</div>' + rf +
    '<div class="rfoot">인생 한 판 · ' + d.getFullYear() + '.' + (d.getMonth() + 1) + '.' + d.getDate() + '</div></div></div>' +
    '<div class="actions"><button class="btn go" onclick="saveImg()">📷 이미지로 저장</button><div class="btnrow"><button class="btn small" onclick="showReflect()">✏️ 생각 고치기</button><button class="btn small" onclick="restart()">🔄 처음으로</button></div></div>');
  const draw = () => drawGraph($('graph'));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw); else draw();
}
function saveImg() {
  SFX.click();
  if (!window.html2canvas) { alert('저장 기능을 불러오지 못했어요. 화면을 직접 캡처해 주세요.'); return; }
  html2canvas($('card'), { scale: 2, backgroundColor: null, useCORS: true }).then(c => {
    const a = document.createElement('a'); a.download = '인생한판_' + S.name + '.png'; a.href = c.toDataURL('image/png');
    document.body.appendChild(a); a.click(); a.remove();
  }).catch(() => alert('이미지 저장에 실패했어요. 화면을 직접 캡처해 주세요.'));
}
function restart() { if (confirm('처음부터 다시 시작할까요?')) { clearSave(); showStart(); } }

/* 키보드: 1~4 선택, Enter 다음 */
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 4) { const b = document.querySelectorAll('.choice')[n - 1]; if (b && !b.disabled) b.click(); }
  else if (e.key === 'Enter') { const b = document.querySelector('.btn.go'); if (b) b.click(); }
});

showStart();
</script>
